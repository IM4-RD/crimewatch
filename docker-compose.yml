version: '3.9'

services:
  # ── MySQL Database Server ─────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: crimewatch-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: ${DB_NAME:-crimewatch}
      MYSQL_USER: ${DB_USER:-crimewatch_app}
      MYSQL_PASSWORD: ${DB_PASS:-change_me_strong_password}
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - crimewatch_net
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ── FastAPI Backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crimewatch-api
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-crimewatch}
      DB_USER: ${DB_USER:-crimewatch_app}
      DB_PASS: ${DB_PASS:-change_me_strong_password}
      SECRET_KEY: ${SECRET_KEY:-change_me_generate_with_python}
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      PORT: 8000
      MEDIA_DIR: /app/media
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - crimewatch_media:/app/media
      - ./backend/keys:/app/keys
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      timeout: 10s
      retries: 5
    networks:
      - crimewatch_net

  # ── NGINX Reverse Proxy ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: crimewatch-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/public:/var/www/crimewatch/frontend/public:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - crimewatch_net

  # ── Optional: Redis for sessions & caching ────────────────
  redis:
    image: redis:alpine
    container_name: crimewatch-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - crimewatch_net

volumes:
  mysql_data:
    driver: local
  crimewatch_media:
    driver: local
  redis_data:
    driver: local

networks:
  crimewatch_net:
    driver: bridge
